<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" fill="none">
  <defs>
    <linearGradient id="lg" x1="120" y1="80" x2="780" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F0FF"/>
      <stop offset="0.45" stop-color="#F5F9FF"/>
      <stop offset="1" stop-color="#FAFCFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="360" y1="520" x2="620" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E6DFF"/>
      <stop offset="1" stop-color="#4D93FF"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="280" y1="680" x2="560" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E6DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E6DFF" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="960" height="1080" fill="url(#lg)"/>
  <!-- wireframe rings -->
  <circle cx="480" cy="420" r="280" stroke="#1E6DFF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="10 14"/>
  <circle cx="480" cy="420" r="220" stroke="#1E6DFF" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="480" cy="420" r="360" stroke="#1E6DFF" stroke-opacity="0.08" stroke-width="1"/>
  <!-- accents -->
  <g opacity="0.55">
    <rect x="140" y="220" width="36" height="36" rx="6" stroke="#1E6DFF" stroke-opacity="0.35" transform="rotate(-18 158 238)"/>
    <rect x="760" y="320" width="28" height="28" rx="5" stroke="#1E6DFF" stroke-opacity="0.28" transform="rotate(22 774 334)"/>
    <path d="M680 720 L708 752 L676 758 Z" stroke="#1E6DFF" stroke-opacity="0.3" fill="none"/>
  </g>
  <!-- glow -->
  <ellipse cx="480" cy="520" rx="320" ry="260" fill="#1E6DFF" fill-opacity="0.06" filter="url(#blur)"/>
  <!-- podium -->
  <ellipse cx="480" cy="780" rx="220" ry="36" fill="url(#blueSoft)"/>
  <ellipse cx="480" cy="740" rx="160" ry="26" fill="#1E6DFF" fill-opacity="0.15"/>
  <!-- cloud -->
  <g opacity="0.92">
    <path d="M320 460 C280 460 248 492 248 532 C248 572 280 604 328 608 L632 608 C684 604 716 572 716 532 C716 498 692 468 656 458 C642 418 598 392 548 392 C508 392 472 412 452 442 C438 428 418 420 396 420 C354 420 320 452 320 492 C320 494 320 496 320 498 Z" fill="white" stroke="#1E6DFF" stroke-opacity="0.25" stroke-width="2"/>
    <path d="M392 528 L472 472 L552 528" stroke="#1E6DFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M472 472 V548" stroke="#1E6DFF" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- server rack -->
  <g transform="translate(560 560)">
    <rect x="0" y="0" width="88" height="120" rx="8" fill="white" stroke="#1E6DFF" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="12" y="14" width="64" height="14" rx="3" fill="#ECF3FF"/>
    <rect x="12" y="38" width="64" height="14" rx="3" fill="#ECF3FF"/>
    <rect x="12" y="62" width="64" height="14" rx="3" fill="#ECF3FF"/>
    <circle cx="74" cy="21" r="4" fill="#1E6DFF"/>
    <circle cx="74" cy="45" r="4" fill="#1E6DFF"/>
    <circle cx="74" cy="69" r="4" fill="#1E6DFF"/>
  </g>
  <!-- shield -->
  <g transform="translate(260 560)">
    <path d="M52 8 L92 28 V76 C92 104 72 128 52 140 C32 128 12 104 12 76 V28 Z" fill="white" stroke="#1E6DFF" stroke-width="2.5"/>
    <path d="M38 72 L48 84 L72 52" stroke="#1E6DFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- pin -->
  <g opacity="0.85" transform="translate(720 420)">
    <path d="M0 36 C0 14 14 0 28 0 C42 0 56 14 56 36 C56 54 28 84 28 84 C28 84 0 54 0 36 Z" fill="#1E6DFF" fill-opacity="0.88"/>
    <circle cx="28" cy="34" r="10" fill="white"/>
  </g>
</svg>
